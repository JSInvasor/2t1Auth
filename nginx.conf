server {
    listen 80;
    listen [::]:80;
    server_name 2t1.online www.2t1.online;

    # Eğer Cloudflare HTTPS zorluyorsa bu satırı açabilirsin, ancak genelde WAF üzerinden yönetilir.
    # return 301 https://$server_name$request_uri;

    root /var/www/2t1.online;
    index index.php index.html index.htm;

    # Cloudflare Gerçek IP Alma (WAF/Cloudflare arkasında çalışması için kritik)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Güvenlik Başlıkları (Custom WAF'ı Destekler)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location = /loader {
        rewrite ^ /loader.php last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP-FPM Yapılandırması (Sürüm 8.1 olarak varsayıldı, sunucuna göre güncelleyebilirsin)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; 
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Gizli dosyalara ve bot loglarına erişimi engelle
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location /data {
        deny all;
    }
    location /logs {
        deny all;
    }
}
